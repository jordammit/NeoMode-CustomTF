// Enable crash logging
//sv_crashlog 1 - only works in cpqwsv.exe

//sv_serverip "yourIPhere"

//setmaster "master.quakeservers.net:27000"
setmaster "qwmaster.fodquake.net:27000"

hostname "24/7 Neo Mode 2026 | Classic CustomTF 2009"

// Override the cpcycle directory to use another directory so that we can have separate ones for multiple CuTF servers.
//localinfo cycledir cpcycle_shaka

sv_logdir fortress/logs
logfile

sv_crypt_rcon 1

// !!!!!! CHANGE THESE !!!!!!
master_rcon_password "followthewhiterabbit"
rcon_password "followthewhiterabbit"
localinfo adminpwd "followthewhiterabbit"

exec cpsvdefs.cfg

// Server aliases
alias ' status
//alias q "pinmsg save;writeip;quit"
alias res restart

// Set sniper damage factor
localinfo sniper_factor 0.85

// Set prematch time and respawn delay
localinfo prematch 0           // PZ: I don't really see a point in prematch time (this was set to 3).
//localinfo respawn_delay 5

// Manually pick a progs file to use with the server - defaults to prozac.dat
sv_progsname prozac

//sv_unfake 2 - idk what this does ~STAL

// VERY IMPORTANT! Allows lit's, hrt's and sky's download
allow_download_other 1

// Important disable filesystem caching
// fs_cache 0

// Set 100 HZ physics
//sv_mintic 0.01 - Not sure if this is actually needed for 09 CuTF? -STAL

maxclients 32
maxspectators 8

// Set up the votemap menu items
exec votemap.cfg

// Maps flagged as watervised should turn watervis on automatically.
// PZ NOTE: You can set watervis to 1 in <mapname>.cfg files in cpcycle. Those files execute at the start of the map.
localinfo autoset_watervis 1    // PZ NOTE: ezQuake uses gl_turbalpha to turn it on instead of r_wateralpha.

// Load pinned messages if any
pinmsg load

// Restore penalties
exec listip.cfg

// Uncomment the following lines to disable voting in the progs/mod.
//localinfo no_votemap 1
//localinfo no_punish 1

// Enable the following line to disable any brightness change effects in the progs/mod.
//localinfo no_bright 1

// load .ent files
sv_loadentfiles 1

// turn psi grens off.
//localinfo no_psi on

logplayers
logrcon
logerrors
fraglogfile

localinfo nicecolors 1 // I don't think this works anymore, but I can't let it go -STAL
localinfo runes 0
localinfo money 11000

// Ensure clients are getting the fastest possible download speed
sv_maxdownloadrate 10000000

//sys_restart_on_error 1

//sv_logfile 1 - cpqwsv
//sv_fraglogfile 1 - cpqwsv

map mlobby2
serverinfo n 1